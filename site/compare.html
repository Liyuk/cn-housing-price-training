<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对比 · 趋势看板</title>
  <meta name="description" content="选 2–5 个地区叠加比较：统一基期、同比、距高点，自定义时间范围与区间统计。" />
  <meta name="color-scheme" content="dark light" />
  <script>try { var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preload" href="assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="shell-header"></div>
  <main class="wrap">
    <section class="page-head">
      <h1>对比：谁涨得多、谁跌得多</h1>
      <p class="lead">选 2–5 个地区叠加。比较涨跌要有同一个起点：默认以所选时间范围的第一个月为 100，也可以指定任意月份——比如从 2021-07 全国高点算起。</p>
    </section>
    <section class="block tight">
      <div class="panel hero">
        <div class="cmp-pick" id="cmp-pick"></div>
        <div class="tv-bar" id="cmp-bar"></div>
        <p class="tv-hint">在图上横向拖选一段即可缩放并统计该区间；链接保留当前选择，可以直接分享。</p>
        <div id="cmp-chart" class="chart tall" role="img" aria-label="多个地区的价格指数对比"></div>
        <p class="foot" id="cmp-foot"></p>
        <div class="tv-stats" id="cmp-stats"></div>
      </div>
    </section>
  </main>
  <div id="shell-footer"></div>
  <script type="module" src="assets/js/pages/compare.js"></script>
</body>
</html>
